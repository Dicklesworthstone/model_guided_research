# =============================================================================
# HYPOTHESIS REGISTRY — the empirical twin of hypotheses/theorems.yaml.
#
# Bead: model_guided_research-hij.1 (EPIC model_guided_research-hij)
#
# WHAT THIS FILE IS
#   Every load-bearing EMPIRICAL claim in this project gets one entry here: a
#   stable id, the claim in prose, where the claim came from, and — when the
#   claim is operationalized — a PREREGISTERED prediction naming the exact
#   metric, comparator, baseline, effect size, and seed count that would
#   support or refute it. Mathematical claims live in theorems.yaml; a claim
#   lives in exactly one registry. Before this file, claims lived in README
#   prose and the framework docs where none could ever be formally confirmed
#   or retired.
#
# SERIALIZATION (inherited from vnl.1, which landed first and decided for
#   both registries): YAML via PyYAML safe_load.
#
# STATUS SEMANTICS
#   open          — registered, no adjudicated evidence yet.
#   supported     — adjudicated evidence meets the registered prediction.
#   refuted       — adjudicated evidence contradicts the registered prediction.
#   inconclusive  — evidence gathered but does not decide (e.g. CI spans 0).
#   blocked       — cannot run yet; operationalization_note names the blocker.
#
# PREDICTION SEMANTICS (the contract the verdict engine hij.2 will execute)
#   metric_path: "<schema>:<dotted.path>" into a versioned artifact schema:
#     evaltasks — mgr.evaltasks.v1/v2 (mgr eval-tasks summary.json)
#     train     — mgr.telemetry.v1 (nanochat train summary.json)
#     certify   — mgr certify summary.json
#     bench     — mgr bench-fixed-flops aggregate
#   comparator + threshold_kind define the claim, with M = metric(mechanism)
#   and B = metric(baseline.mechanism) at the SAME FLOPs budget:
#     ">=" + absolute_delta : claim holds iff M >= B + threshold
#     "<=" + absolute_delta : claim holds iff M <= B - threshold
#     ">=" + ratio          : claim holds iff M/B >= threshold
#     "<=" + ratio          : claim holds iff M/B <= threshold
#   RATIO claims are in RATIO SPACE (the engine compares mean(C)/mean(B)
#   against the threshold directly). For positive-valued metrics this equals
#   the "M vs threshold*B" reading; for NEGATIVE-valued metrics (e.g.
#   length_slope) dividing by B flips the inequality, so register the
#   comparator in ratio space - "2x flatter negative slope" is "<=" 0.5,
#   never ">=" 0.5 (the latter would refute flat candidates and support
#   steep ones).
#   min_seeds: the verdict needs at least this many TRAINING RUNS per arm
#   (ci-v2 counts one observation per trained model, never per eval seed);
#   the CI convention (mean +/- CI95 must clear the threshold) is adjudicated
#   by the verdict engine (policy stamped per verdict), recorded in
#   verdict_history.
#   variant selectors (optional, rgyl): when both arms share a mechanism but
#   differ in a recorded knob (e.g. dequantization annealing vs fixed beta),
#   baseline.variant and prediction.candidate_variant are mappings of
#   recorded hparams/config keys -> scalar values matched by equality
#   (null matches recorded-null AND knob-absent, so pre-rgyl artifacts count
#   as the all-defaults arm). Example:
#     baseline:  {mechanism: tropical, equal_flops: true,
#                 variant: {semiring_beta_spec: "1.0"}}
#     candidate_variant: {semiring_beta_spec: "linear:1:32"}
#   validity (optional, ci-v2 floor gate — the pilot1/kbj2 lesson): a
#   REFUTED verdict additionally requires the BASELINE to have demonstrably
#   cleared the answer-prior floor. Below it every arm sits at the
#   best-constant-answer score, the experiment has no power to surface a
#   mechanism advantage, and a null effect is evidence of NO POWER, not
#   evidence of absence — the verdict downgrades to INCONCLUSIVE
#   (floor_effect: true). Fields:
#     baseline_floor — fallback floor: the population majority-answer prior
#       of the task's held-out split. The engine PREFERS the artifact-
#       recorded answer_prior (mgr.evaltasks.v2: the exact best-constant
#       score on the docs actually scored) whenever every baseline artifact
#       records it.
#     floor_margin   — optional gate widening (default 0.0).
#     floor_source   — how the floor was computed (required).
#   prediction: null is allowed ONLY with an operationalization_note naming
#   what is missing — visible debt, never silent omission.
#   statistical integrity (ci-v4, bead hij.4): every adjudicated arm records
#   achieved POWER for the registered effect size (distance from the
#   no-effect point — delta 0 / ratio 1 — to the threshold) at the observed
#   variance, plus the seed count for 80% power. SUPPORTED/REFUTED below 50%
#   power carries underpowered: true in the arms record — an asterisk, never
#   a clean verdict (statuses are unchanged). Each arm also records a
#   one-sided P_VALUE against its own registered threshold (parametric t for
#   Welch/Student arms; the deterministic bootstrap's wrong-side proportion,
#   add-one smoothed, for ratio arms). Each `mgr adjudicate` run computes
#   Benjamini–Hochberg q-values over its family and reports BOTH numbers:
#   "N supported, of which M survive FDR at q=0.10" — q-values are family-
#   relative, so they live in run reports (verdicts.json), never in this
#   ledger. Directional preregistration bars forking-paths inflation; FDR is
#   the backstop for family SIZE, not a substitute. `mgr hypotheses power`
#   renders the power table standalone. min_seeds in NEW entries should be
#   power-derived once pilot variance exists (mgr hypotheses power tells you
#   the number); existing entries are grandfathered until re-registered.
#
# GOVERNANCE
#   Changes flow through normal git review. verdict_history is APPEND-ONLY:
#   `mgr hypotheses validate` compares against the committed parent version
#   (git HEAD) and rejects any rewrite or truncation of an existing entry's
#   history. New evidence appends; it never replaces.
# =============================================================================

