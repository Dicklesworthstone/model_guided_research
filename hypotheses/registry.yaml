  # ---------------------------------------------------------------------------
  # Integrable attention (braid rmatrix law) - bead u55.3. Registered BEFORE any
  # word-problem training campaign. Protocol shared by the slope entries:
  # held-out lengths 2x-8x train (the group task's built-in split), >=3 seeds
  # per arm at equal FLOPs, greedy decode, doc-level OLS slope of held-out
  # exact-match vs word length (evaltasks length_slope, additive-in-v2 field,
  # per-group breakdown via the task's category extractor).
  # ---------------------------------------------------------------------------
  - id: hyp-rmatrix-s5-length-slope
    statement: >-
      On S5 word problems (non-solvable; NC1-complete state tracking), R-matrix
      braid attention shows a length-generalization slope at least 2x flatter
      than standard attention at equal FLOPs: integrable monodromy mixing
      matches the task's sequential-composition structure, so accuracy decays
      with held-out word length at no more than half the baseline rate. No
      expressivity-separation claim is made (both mechanisms sit inside the
      TC0-type upper bounds); this is a learnability/extrapolation-slope claim.
    mechanisms: [braid]
    source:
      kind: model
      provenance: "EPIC THEORY-II u55.3 (preregistered leapfrog test); theory note markdown_documentation/integrable_attention_rmatrix.md section 6"
    date_registered: "2026-06-11"
    theorem_refs: [thm-ybe-transfer-commutativity, thm-rmatrix-inversion-protected-memory]
    prediction:
      metric_path: "evaltasks:tasks.group.length_slope.by_category.s5.slope"
      comparator: "<="
      threshold_kind: ratio
      threshold: 0.5
      baseline: {mechanism: standard, equal_flops: true}
      min_seeds: 3
      scale_caveats: >-
        RATIO-SPACE SEMANTICS (fresh-eyes fix, pre-evidence): the engine
        compares effect = mean(C)/mean(B) against the threshold directly.
        Both slopes are negative (accuracy decays with length), so the ratio
        is positive and "2x flatter" reads M/B <= 0.5 - comparator "<=". (The
        originally drafted ">=" encoded "M >= 0.5*B", which INVERTS under
        division by the negative baseline - it would have refuted flat
        candidates and supported steep ones.) Sign caveat: a non-negative
        rmatrix slope against a decaying baseline gives ratio <= 0 <= 0.5,
        and SUPPORTED is the correct reading (flat-or-better beats
        2x-flatter). The engine's answer-prior floor gate does not fire on
        slope paths, so the verdict is meaningful ONLY if the baseline's
        in-range exact match clears the group answer prior - a flat-at-chance
        baseline has slope ~0 and the comparison is vacuous; adjudication
        must check that precondition by hand (or via
        hyp-group-nonsolvable-barrier's baseline curves) until the engine
        learns slope-path floors. The candidate arm is selected by variant
        {braid_crossing_law: rmatrix}; evaltasks artifacts must record
        meta.checkpoint.model_config for the selector to resolve.
      candidate_variant: {braid_crossing_law: "rmatrix"}
    status: inconclusive
    evidence: []
    verdict_history:
      - {date: "2026-06-11", verdict: supported, artifacts: ["artifacts/evals/tasks/e1-group-rmatrix-s0-v3/summary.json", "artifacts/evals/tasks/e1-group-rmatrix-s1-v2/summary.json", "artifacts/evals/tasks/e1-group-rmatrix-s2-v2/summary.json", "artifacts/evals/tasks/e1-group-standard-s0/summary.json", "artifacts/evals/tasks/e1-group-standard-s1/summary.json", "artifacts/evals/tasks/e1-group-standard-s2/summary.json"], adjudicator: "engine:ci-v3", policy_version: "ci-v3", arms: {"braid": {"budget_flops": 100000000000000.0, "ci95": [-0.0, 0.0], "effect": -0.0, "n_baseline": 3, "n_candidate": 3, "verdict": "supported"}}}
