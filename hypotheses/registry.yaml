      theory says they can be, and not where it says they cannot: probes
      (linear, then small-MLP) from the final braid layer's charge observables
      <v, t(theta_k) v>/<v, v> to the composed group element score well above
      chance (> 2x the 1/|G| floor) on the abelian control Z60 - whose product
      is a symmetric statistic, in the span of the U(1)-symmetric charge tower
      - and at or near chance on the non-solvable S5/A5, whose order-sensitive
      product is not. Conservation (hyp-rmatrix-charge-drift-separation) and
      decodability are BOTH required for the protected-memory story; if
      decodability fails everywhere, the honest conclusion is that the
      integrable structure conserves the wrong quantities for this task, and
      the redesign direction is a higher-rank R-matrix whose charge tower spans
      the group algebra.
