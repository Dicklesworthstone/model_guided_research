  - id: hyp-tropical-evt-miscoupling
    statement: >-
      Tropical (max-plus) attention is an EXTREME-VALUE class, not CLT: its
      coordinate-check slope drifts (|slope| >= 0.10) under the CLT-muP scaling
      because the max-over-N score location grows with sqrt(2 ln N), and
      flattens (|slope| <= 0.05) only under the derived per-stage Gumbel
      location correction. The falsifiable content is the SEPARATION - a flat
      line under both parameterizations would refute the EVT account.
    mechanisms: [tropical]
    source:
      kind: model
      provenance: "EPIC THEORY-III lab.1 (the novel EVT-class contribution); theory note sections 2a, 4"
    date_registered: "2026-06-13"
    prediction: null
    operationalization_note: >-
      Both-ways observable: coordinate_check('tropical', widths) under
      --parameterization current (predict |slope| >= 0.10, score scale drifts)
      vs --parameterization nsa (predict |slope| <= 0.05, the per-stage
      exact-E[max] location shift flattens it). A test that cannot fail proves
      nothing, so BOTH arms are required and the separation is the claim.
      Blocked on (a) the --parameterization flag wiring (nsa multiplier table
      into gpt.py/train.py) and (b) coord-check artifact engine ingestion -
      both in the lab.1 follow-on. The EVT ingredient (exact E[max] within
      0.2% of MC; asymptote ~33% high at N=16) is already validated
      standalone in tests/test_parameterization.py.
    status: open
    evidence: []
    verdict_history: []

  - id: hyp-tropical-length-evt-signature
    statement: >-
      The extreme-value correction runs over the CONTEXT-LENGTH max-axis too:
      tropical attention's effective routing temperature drifts with
      sqrt(2 ln T) as eval context length T grows, so its margin (gamma)
      statistics shift with ln T in a shape predictable BEFORE measurement
      from the exact E[max] curve - a length-extrapolation effect CLT
      reasoning misses entirely.
    mechanisms: [tropical]
    source:
      kind: model
      provenance: "EPIC THEORY-III lab.1 section 3 (the N-axes extension); cross-links C5/E3 length studies"
    date_registered: "2026-06-13"
    prediction: null
    operationalization_note: >-
      Observable: the tropical margin (gamma) statistics already logged by the
