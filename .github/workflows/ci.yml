name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run ruff linter
        run: uv run ruff check .

      - name: Run ruff formatter check
        run: uv run ruff format --check .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra server --extra viz --extra tokenizer-train

      - name: Enforce ty diagnostic baseline
        run: scripts/ci_lite.sh --typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra test

      - name: Run tests with pytest
        run: |
          uv run pytest tests/ \
            -v \
            --tb=short \
            --ignore=tests/test_runner.py \
            --ignore=tests/test_runner_enhanced.py \
            -x
        env:
          JAX_PLATFORMS: cpu

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: |
            .pytest_cache/
            **/*.log
          retention-days: 7

  certificates:
    name: Certificates (mgr certify)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run mechanism certificates (separate job so a cert failure is
          distinguishable from a unit-test failure in the PR UI)
        run: |
          uv run mgr certify --device cpu --dtype fp32 --seed 42 \
            --artifacts-dir artifacts/ci-cert
        env:
          JAX_PLATFORMS: cpu

      - name: Upload certificate artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: certificate-results
          path: artifacts/ci-cert/
          retention-days: 14

  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, certificates]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "Lint job failed"
            exit 1
          fi
          if [[ "${{ needs.typecheck.result }}" != "success" ]]; then
            echo "Type check job failed"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Test job failed"
            exit 1
          fi
          if [[ "${{ needs.certificates.result }}" != "success" ]]; then
            echo "Certificates job failed"
            exit 1
          fi

  # Lean proofs (bead vnl.2). SEPARATE, initially NON-BLOCKING job: runs on
  # pushes to main and manual dispatch only, never on PRs. Promotion to
  # required: warm build < 10 min sustained for two weeks of green.
  # NOTE: `lake build` success does NOT imply no `sorry` (sorry only warns);
  # the axiom gate below greps the audit output for sorryAx explicitly.
  lean-proofs:
    name: Lean proofs (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Lean toolchain (elan)
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs
          auto-config: false
          use-github-cache: true

      - name: Axiom gate (no sorryAx)
        working-directory: proofs
        run: |
          lake env lean AxiomCheck.lean > axioms.txt
          cat axioms.txt
          if grep -q sorryAx axioms.txt; then
            echo "::error::sorryAx found in axiom audit"
            exit 1
          fi
