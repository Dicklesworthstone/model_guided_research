      quantization as valuation truncation inherits the flat-error lemma on
      the p-adic-native path (errors below digit k cannot accumulate), while
      float rounding compounds - quantified as area-under-quality-curve over
      the precision sweep, cliff-vs-graceful as the qualitative signature.
